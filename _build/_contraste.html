<!doctype html><meta charset="utf-8">
<title>Contraste de logos</title>
<style>
  body{margin:0;background:#0A0A0B;color:#A9A49A;font:12px/1.4 system-ui;padding:18px}
  h2{font:500 13px system-ui;color:#F6F4F1;margin:22px 0 10px;letter-spacing:.04em}
  .fila{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .c{background:#26262a;border:1px solid #1C1B19;position:relative;overflow:hidden}
  .c canvas{display:block;width:100%;height:auto}
  .et{padding:7px 9px;font-size:10.5px;color:#7E7B73;border-top:1px solid #1C1B19}
</style>
<div id="salida"></div>
<script>
const CASOS = [
  ['e07','Grupo IDET','../assets/logo-e07.png'],
  ['e08','Universidad Nueva Esparta','../assets/logo-e08.png'],
  ['e06','Ibero Seguros','../assets/logo-e06.png'],
];
// fondo tipo escena: gris oscuro parecido a la foto con velo
const FONDO = [38,38,42];

function pinta(im, modo){
  const W=340, H=170;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='rgb('+FONDO.join(',')+')'; x.fillRect(0,0,W,H);
  const r=Math.min((W*0.72)/im.naturalWidth,(H*0.66)/im.naturalHeight);
  const w=im.naturalWidth*r, h=im.naturalHeight*r;
  x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
  if (modo!=='original'){
    const d=x.getImageData(0,0,W,H);
    const p=d.data;
    for(let i=0;i<p.length;i+=4){
      const l=0.2126*p[i]+0.7152*p[i+1]+0.0722*p[i+2];
      // pixel de fondo puro: no tocar
      if(Math.abs(p[i]-FONDO[0])<3 && Math.abs(p[i+1]-FONDO[1])<3 && Math.abs(p[i+2]-FONDO[2])<3) continue;
      if(modo==='invertir'){ const v=255-l; p[i]=p[i+1]=p[i+2]=v; }
      if(modo==='blanco'){ p[i]=p[i+1]=p[i+2]=255; }
      if(modo==='levantar'){ const v=Math.min(255, l*1.35+110); p[i]=p[i+1]=p[i+2]=v; }
    }
    x.putImageData(d,0,0);
  }
  return c;
}

const MODOS=[['original','Como está hoy'],['invertir','Monocromo invertido'],['blanco','Silueta blanca'],['levantar','Monocromo aclarado']];

(async ()=>{
  const out=document.getElementById('salida');
  for(const [id,nombre,src] of CASOS){
    const im=new Image(); im.src=src; await im.decode();
    const h=document.createElement('h2'); h.textContent=nombre; out.appendChild(h);
    const f=document.createElement('div'); f.className='fila';
    for(const [modo,etiqueta] of MODOS){
      const cel=document.createElement('div'); cel.className='c';
      cel.appendChild(pinta(im,modo));
      const e=document.createElement('div'); e.className='et'; e.textContent=etiqueta;
      cel.appendChild(e); f.appendChild(cel);
    }
    out.appendChild(f);
  }
})();
</script>
